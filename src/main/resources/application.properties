# ===============================
# Application Configuration
# ===============================
spring.application.name=smart-city-backend

# IMPORTANT for Railway/Render deployment
server.port=${PORT:8080}


# ===============================
# DATABASE CONFIG (RAILWAY)
# ===============================
# Values will come from Railway environment variables

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


# ===============================
# JWT CONFIGURATION
# ===============================
jwt.secret=CHANGE_THIS_TO_STRONG_SECRET_KEY_256_BITS
jwt.expiration=86400000


# ===============================
# CORS CONFIGURATION
# ===============================
cors.allowed.origins=http://localhost:5173,http://localhost:3000,https://smartcity-frontend-i3rm7e5sd-2400031722s-projects.vercel.app,https://hoppscotch.io


# ===============================
# LOGGING
# ===============================
logging.level.com.smartcity=DEBUG
logging.level.org.springframework.security=DEBUG
